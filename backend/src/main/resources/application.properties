# ===================================================================
# CampusFix & CampusFind AI - Spring Boot Application Configuration
# ===================================================================

server.port=8080
spring.application.name=campus-management-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campus_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# CORS Configuration
campus.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://ais-dev-jpj2vwbja3at4st234rx37-100249297697.asia-southeast1.run.app

# Logging
logging.level.com.campusfix=DEBUG
logging.level.org.springframework.web=INFO
