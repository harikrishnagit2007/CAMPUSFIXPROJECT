# ===================================================================
# CampusFix & CampusFind AI - Spring Boot 3 Application Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful

spring.application.name=campus-management-backend

# ===================================================================
# MySQL 8.0+ Database Configuration
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=CampusFixHikariCP

# ===================================================================
# JPA / Hibernate Properties (MySQL 8 Dialect)
# ===================================================================
# 'validate' ensures database schema matches JPA Entities without destructive modifications
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Disable open-in-view to enforce explicit transactional boundaries in Service layer
spring.jpa.open-in-view=false

# ===================================================================
# Flyway Database Migration
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ===================================================================
# Jackson JSON Serialization & Date/Time
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# File Upload / Multipart Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# OpenAPI / Swagger UI
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================================================================
# CORS Configuration (Configured in WebMvcConfig)
# ===================================================================
campus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ais-dev-jpj2vwbja3at4st234rx37-100249297697.asia-southeast1.run.app,https://ais-pre-jpj2vwbja3at4st234rx37-100249297697.asia-southeast1.run.app}

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.com.campusfix=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO
